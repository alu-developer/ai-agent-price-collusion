[project]
name = "price-agents"
version = "0.3.0"
description = "Reproducible experiments on AI-agent price coordination"
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0", "anthropic>=0.40.0"]

[project.optional-dependencies]
google = ["google-genai>=0.3.0"]
dev = ["pytest>=8.0.0"]
paper = ["matplotlib>=3.8.0"]

[project.scripts]
price-agents = "price_agents.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
